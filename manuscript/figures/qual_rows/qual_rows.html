  .img { position:relative; height:57px; overflow:hidden; background:#000; }
  .img img { display:block; width:100%; height:100%; object-fit:cover; }
  .img.ours { outline: 1.3px solid var(--ours); outline-offset: -1.3px; }
  .blk { position:relative; }
  .blk span { position:absolute; left:50%; top:59px; transform: translate(-50%, -50%) rotate(-90deg); white-space:nowrap;
