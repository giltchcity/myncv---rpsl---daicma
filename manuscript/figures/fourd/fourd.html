<!doctype html>
<html><head><meta charset="utf-8"><title>The map of any time</title>
<style>
  @page { size: 6.875in 2.760in; margin: 0; }
  :root { --ours:#BF9000; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#fff; }
  body { width:6.875in; height:2.760in; font-family: "Times New Roman", Times, serif; color:#000;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .fig { display:grid; justify-content:center; padding:6px 6px 4px; column-gap:3px; row-gap:3px;
         grid-template-columns: 12px 148px 148px 9px 148px 148px; grid-template-rows: 12px 111px 111px 12px; }
  .rl { display:flex; align-items:center; justify-content:center; }
  .rl span { transform: rotate(-90deg); white-space:nowrap; font-size:7.4pt; }
  .rl.ours span { font-weight:700; color:var(--ours); }
  .head { font-size:7.6pt; text-align:center; align-self:end; }
  .img { position:relative; overflow:hidden; background:#000; }
  .img img { display:block; width:100%; height:100%; object-fit:cover; }
  .img.ours { outline: 1.4px solid var(--ours); outline-offset: -1.4px; }
  .psnr { position:absolute; right:3px; bottom:3px; font-size:6pt; line-height:1; color:#000;
          background:rgba(255,255,255,.88); border-radius:1px; padding:1.4px 2.6px; }
  .label { grid-column: span 2; font-size:7.4pt; font-style:italic; text-align:center; align-self:start; }
</style></head>
<body><div class="fig">
<div></div>
<div class="head">1st visit, 32 s</div>
<div class="head">2nd visit, 76 s</div>
<div></div>
<div class="head">2nd visit, 43 s</div>
<div class="head">2nd visit, 108 s</div>
<div class="rl"><span>Ground truth</span></div>
<div class="img"><img src="assets/bed0_gt.png"></div>
<div class="img"><img src="assets/bed1_gt.png"></div>
<div></div>
<div class="img"><img src="assets/win0_gt.png"></div>
<div class="img"><img src="assets/win1_gt.png"></div>
<div class="rl ours"><span>Ours, map at <i>t</i></span></div>
<div class="img ours"><img src="assets/bed0_ours.png"><span class="psnr">29.0 dB</span></div>
<div class="img ours"><img src="assets/bed1_ours.png"><span class="psnr">26.8 dB</span></div>
<div></div>
<div class="img ours"><img src="assets/win0_ours.png"><span class="psnr">20.7 dB</span></div>
<div class="img ours"><img src="assets/win1_ours.png"><span class="psnr">24.3 dB</span></div>
<div></div>
<div class="label">(a) The bed moved between the visits.</div>
<div></div>
<div class="label">(b) The sofa replaced the lounge chair while the robot looked away.</div>
</div></body></html>
